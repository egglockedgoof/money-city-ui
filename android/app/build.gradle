plugins { id 'com.android.application' }

// Release signing comes from a keystore.properties that is NEVER committed.
// Default location: /home/box/shared/marrowz/phantomway_android/keystore.properties
// (override with -PphantomKeystoreProps=/path). Without it, the release build is unsigned.
def ksPropsFile = file(project.findProperty('phantomKeystoreProps') ?: '/home/box/shared/marrowz/phantomway_android/keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }

android {
    namespace 'way.phantom.app'
    compileSdk 34
    defaultConfig {
        applicationId 'way.phantom.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        if (ksProps['storeFile']) {
            release {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksProps['storeFile']) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
