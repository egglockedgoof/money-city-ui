<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#05070c;color:#f6e8ea;font:15px/1.45 -apple-system,Roboto,sans-serif}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center;background:radial-gradient(90% 60% at 50% 42%,rgba(150,8,24,.28),transparent 70%)}
b{letter-spacing:.32em;color:#ffb3bc;text-transform:uppercase;font-size:14px}
p{margin:0;max-width:320px;color:rgba(255,200,205,.8)}
button{min-height:48px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,170,180,.5);color:#fff;font-weight:700;font-size:15px;background:linear-gradient(180deg,#ff3a52,#9c0c1c)}
small{opacity:.5;font-size:12px}</style></head>
<body><div class="w"><b>PhantomWay</b><p>Can't reach the heart right now. Make sure Termux (the heart) is running, or that Tailscale is connected.</p>
<button onclick="PhantomNative.retry()">Try again</button><small id="t"></small></div>
<script>try{document.getElementById('t').textContent=PhantomNative.tried()}catch(e){}</script></body></html>
