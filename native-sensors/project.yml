name: BareMetal
options:
  bundleIdPrefix: com.marrow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BareMetal:
    type: application
    platform: iOS
    sources:
      - path: BareMetal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marrow.baremetal
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "4"
        INFOPLIST_FILE: BareMetal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
