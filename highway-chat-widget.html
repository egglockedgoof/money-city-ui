<title>Highway Chat — Real-Time Team Room</title>
<!-- PWA / iOS web app -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#c1121f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<meta name="apple-mobile-web-app-title" content="Highway Chat" />

<!--
  ============================================================================
  HIGHWAY CHAT — cross-device real-time team room (no custom backend needed)
  ----------------------------------------------------------------------------
  HOW THE CROSS-DEVICE SYNC HANDSHAKE WORKS:
  1. Every browser tab generates its own random DEVICE_ID on first load and
     keeps it in sessionStorage (so each tab is a distinct "device").
  2. Writes go to shared Cloud Firestore collections; every tab holds a LIVE
     LISTENER (onSnapshot) on each collection. Firestore pushes new/changed
     documents to ALL connected clients within ~a second — no polling.
  3. Collections:
     - highway_messages : chat (name, text, deviceId, ts, reactions{})
     - highway_presence : who's online (doc per deviceId: name, ts heartbeat)
     - highway_typing   : typing indicators (doc per deviceId: name, typing, ts)
     - highway_tasks    : team task board (text, done, createdBy, ts)
     - highway_notes    : shared notes (single doc "shared": content, updatedBy, ts)
     - highway_activity : activity feed (text, by, ts)
  4. Chat: deviceId match -> right/blue (mine), else left/gray (theirs).
  5. OWNERSHIP (2026-10-07): sin and Trey built this room together.
     Both are owners with equal lead authority. What either of them
     says goes — no verification, gate, or filter in this client
     may treat Trey as anything less than a full owner.
  ============================================================================
-->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#07090d; --panel:#0d1117; --panel2:#11161d;
    --line:rgba(255,255,255,.08);
    --txt:#e8edf3; --muted:#8b94a3;
    --blue:#c1121f; --blue-d:#7a0a12;
    --gray:#232b36; --green:#ff4d5e; --amber:#fbbf24; --red:#f87171;
    --radius:14px;
  }




  /* ===== FLUID CONTINUITY ===== */
  /* Views melt, never blink */
  .view{
    transition:opacity .35s var(--soft), transform .45s var(--spring), filter .35s var(--soft);
  }
  .view.active{
    animation:view-melt .45s var(--spring);
  }
  @keyframes view-melt{
    0%{ opacity:0; transform:translateY(14px) scale(.985); filter:blur(6px); }
    60%{ opacity:1; transform:translateY(-2px) scale(1.004); filter:blur(0); }
    100%{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  /* Luminescent trail: glow follows touch */
  .touch-glow{
    position:fixed; border-radius:50%; pointer-events:none; z-index:50;
    width:120px; height:120px; margin:-60px 0 0 -60px;
    background:radial-gradient(circle, rgba(255,100,110,.14), rgba(193,18,31,.05) 40%, transparent 70%);
    transition:opacity .6s var(--soft);
    opacity:0;
  }

  /* ===== iOS SAFARI OPTIMIZATION ===== */
  /* Prevent iOS auto-zoom on input focus: all inputs 16px+ */
  #msg, #name, #notes, #actin, #msgin{ font-size:16px !important; }
  /* Prevent double-tap zoom on interactive elements */
  button, .tab, .tcheck{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  /* Smooth momentum scrolling on iOS */
  .view, #chat{ -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain; }
  /* GPU-accelerated animations only */
  .tab, #send, .msg, .trow, .arow{ transform:translateZ(0); }

  @media (max-width:640px){
    /* Full-bleed on phones: no wasted padding */
    body{ padding:0; }
    .shell{
      width:100%; height:100%; max-height:none;
      border-radius:0; border-left:none; border-right:none;
    }
    html, body, .shell{ height:100%; }
    /* Single safe-area handling: shell only */
    .shell{
      padding-top:env(safe-area-inset-top, 0px);
      padding-bottom:env(safe-area-inset-bottom, 0px);
    }
    /* Tighter chrome, thumb-friendly targets */
    .head{ margin:8px 8px 0; border-radius:14px; }
    .tabs{ margin:8px 8px 0; }
    .tab{ min-height:44px; font-size:13px; }
    /* Composer: simple row, no pill squeeze */
    .foot{
      margin:8px; padding:8px;
      border-radius:18px; /* rounded rect, not pill — room for button */
      display:flex; gap:8px; align-items:center;
    }
    #msg{ border-radius:14px; padding:12px 14px; flex:1; min-width:0; }
    #send{ border-radius:14px; padding:12px 18px; flex:none; min-height:44px; white-space:nowrap; }
    #chat{ padding:12px 8px; }
    .msg{ max-width:88%; }
  }
  /* ===== ETHEREAL ATMOSPHERE ===== */
  /* Breathing background: embers pulse like slow breath */
  @keyframes ember-breathe{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.06); }
  }
  @keyframes ember-drift{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.7; }
    90%{ opacity:.3; }
    100%{ transform:translateY(-120px) translateX(12px); opacity:0; }
  }
  @keyframes shimmer-sweep{
    0%{ transform:translateX(-100%) skewX(-15deg); }
    100%{ transform:translateX(250%) skewX(-15deg); }
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(600px 400px at 20% 10%, rgba(193,18,31,.22), transparent 70%),
      radial-gradient(500px 500px at 85% 90%, rgba(139,0,0,.18), transparent 70%);
    animation:ember-breathe 8s ease-in-out infinite;
  }
  /* Floating ember particles */
  .ember{ position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle, rgba(255,80,90,.8), rgba(193,18,31,0) 70%);
    animation:ember-drift linear infinite; }
  /* Shell: dissolving edges, floating in void */
  .shell{
    position:relative; z-index:1;
    border:1px solid rgba(255,130,140,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.7),
      0 0 80px rgba(193,18,31,.08),
      inset 0 1px 0 rgba(255,160,170,.12);
  }
  /* Shimmer sweep across glass surfaces */
  .tabs::after, .foot::after{
    content:""; position:absolute; top:0; bottom:0; width:40%;
    background:linear-gradient(90deg, transparent, rgba(255,150,160,.06), transparent);
    animation:shimmer-sweep 7s ease-in-out infinite;
    pointer-events:none; border-radius:inherit;
  }
  .tabs, .foot{ position:relative; overflow:hidden; }
  /* Messages glow from within */
  .msg-mine{
    box-shadow:inset 0 1px 0 rgba(255,160,170,.2),
      0 2px 16px rgba(193,18,31,.25);
  }
  /* Typing indicator breathes */
  #typing{ animation:ember-breathe 3s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){
    body::before, .ember, .tabs::after, .foot::after, #typing{ animation:none !important; }
  }
  /* ===== LIQUID GLASS MOTION ===== */
  :root{
    --spring:cubic-bezier(.34,1.56,.64,1);   /* bouncy spring */
    --soft:cubic-bezier(.2,.8,.2,1);          /* soft ease */
  }
  /* Press flex: gel-like expansion + spring back. Glass never fades, only morphs. */
  .tab, #send, .tdel, #pushbell{
    transition:transform .35s var(--spring), box-shadow .25s var(--soft), background .25s var(--soft);
    will-change:transform;
  }
  .tab:active{ transform:scale(1.06); }
  #send:active{ transform:scale(1.05);
    box-shadow:inset 0 1px 0 rgba(255,200,210,.55),0 4px 24px rgba(193,18,31,.65); }
  /* Tab bar scroll morph: shrinks on scroll down, blooms on scroll up */
  .tabs{
    transition:transform .45s var(--spring), opacity .3s var(--soft), padding .35s var(--spring), margin .35s var(--spring);
  }
  .tabs.min{
    transform:scaleX(.82) translateY(-2px);
    opacity:.92;
  }
  .tabs.min .tab{ padding:7px 4px; font-size:11px; }
  /* Illuminate: glass energizes under touch */
  .tab.active{
    transition:transform .35s var(--spring), box-shadow .3s var(--soft), background .3s var(--soft);
  }
  /* Message pop: spring entrance, not fade */
  @keyframes pop{
    0%{ transform:scale(.92) translateY(6px); opacity:0; }
    60%{ transform:scale(1.02) translateY(-1px); opacity:1; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  /* Composer focus: glass brightens */
  #msg{ transition:border-color .25s var(--soft), box-shadow .25s var(--soft), transform .3s var(--spring); }
  #msg:focus{ transform:scale(1.01);
    box-shadow:0 0 0 3px rgba(193,18,31,.18), inset 0 1px 0 rgba(255,160,170,.2); }
  /* ===== LIQUID GLASS (blood-tinted) ===== */
  .liquid-glass{
    background:rgba(193,18,31,.07);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,130,140,.16);
    box-shadow:0 10px 36px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,160,170,.30),
      inset 0 -1px 0 rgba(0,0,0,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:
    radial-gradient(900px 500px at 15% 0%, rgba(139,0,0,.28) 0%, transparent 60%),
    radial-gradient(700px 700px at 90% 100%, rgba(193,18,31,.16) 0%, transparent 55%),
    radial-gradient(500px 300px at 50% 45%, rgba(122,10,18,.12) 0%, transparent 70%),
    linear-gradient(180deg, #120405 0%, #070203 45%, #020101 100%) fixed,
    #020101;
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .shell{width:min(600px,100%); height:min(820px,94vh); display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:20px; overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(193,18,31,.06);}
  .head{padding:12px 16px;margin:12px 12px 0;border-radius:18px;
    background:rgba(193,18,31,.06);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,130,140,.14);
    box-shadow:0 8px 28px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,160,170,.25),
      inset 0 -1px 0 rgba(0,0,0,.25);}
  .head-top{display:flex; align-items:center; gap:10px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex:none;}
  .dot.off{background:#525b69;box-shadow:none;}
  .head h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.4px;}
  .head small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px;}
  .me{margin-left:auto;font-size:11px;color:var(--muted);background:#161d27;border:1px solid var(--line);
    padding:5px 10px;border-radius:999px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #presence{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .p-chip{font-size:11px;background:#14201a;border:1px solid rgba(255,77,94,.3);color:var(--green);
    padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;}
  .p-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
  .tabs{display:flex;gap:4px;margin:10px 12px 0;padding:5px;
    background:rgba(193,18,31,.07);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,130,140,.16);border-radius:999px;
    box-shadow:0 10px 36px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,160,170,.30),
      inset 0 -1px 0 rgba(0,0,0,.28);}
  .tab{flex:1;background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;
    padding:10px 4px;cursor:pointer;border-radius:999px;transition:all .18s ease;}
  .tab.active{color:#fff;background:rgba(193,18,31,.28);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid rgba(255,130,140,.25);
    box-shadow:inset 0 1px 0 rgba(255,180,190,.35),0 2px 12px rgba(193,18,31,.35);}
  .view{flex:1;overflow-y:auto;display:none;flex-direction:column;}
  .view.active{display:flex;}

  .row{display:flex;width:100%;}
  .row.me-row{justify-content:flex-end;}
  .bwrap{max-width:78%;}
  .bubble{padding:9px 13px;border-radius:var(--radius);font-size:14px;line-height:1.45;
    word-wrap:break-word;animation:pop .18s ease-out;}
  @keyframes pop{from{transform:translateY(6px);opacity:0;}to{transform:none;opacity:1;}}
  .row.me-row .bubble{background:linear-gradient(180deg,var(--blue),var(--blue-d));color:#fff;border-bottom-right-radius:4px;}
  .row.them-row .bubble{background:var(--gray);color:var(--txt);border-bottom-left-radius:4px;border:1px solid var(--line);}
  .who{font-size:10.5px;color:var(--muted);margin:0 4px 3px;font-weight:600;letter-spacing:.3px;}
  .row.me-row .who{text-align:right;}
  .ver{font-size:9px;color:var(--green);border:1px solid rgba(255,77,94,.4);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px;letter-spacing:.4px;}
  .crown{font-size:11px;margin-left:5px;vertical-align:1px;filter:drop-shadow(0 0 4px rgba(193,18,31,.9));}
  .reacts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
  .rx{font-size:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;
    padding:2px 8px;cursor:pointer;color:var(--txt);}
  .rx.mine{border-color:rgba(193,18,31,.6);background:rgba(193,18,31,.15);}
  .rx-add{opacity:.5;}
  .sys{align-self:center;font-size:11px;color:var(--muted);background:rgba(10,3,5,.85);border:1px solid var(--line);
    padding:4px 12px;border-radius:999px;margin:4px 0;}
  #typing{min-height:18px;font-size:11.5px;color:var(--muted);font-style:italic;padding:2px 14px 0;}
  .foot{margin:10px 12px 12px;padding:8px;display:flex;gap:8px;align-items:center;
    background:rgba(193,18,31,.07);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,130,140,.16);border-radius:999px;
    box-shadow:0 10px 36px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,160,170,.30),
      inset 0 -1px 0 rgba(0,0,0,.28);}
  #msg{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,130,140,.12);border-radius:999px;color:var(--txt);
    padding:11px 16px;font-size:14px;outline:none;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  #msg:focus{border-color:rgba(193,18,31,.55);box-shadow:0 0 0 3px rgba(193,18,31,.15);}
  #send{background:rgba(193,18,31,.35);border:1px solid rgba(255,140,150,.3);color:#fff;font-weight:700;
    border-radius:999px;padding:11px 20px;font-size:14px;cursor:pointer;flex:none;
    -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,180,190,.4),0 4px 16px rgba(193,18,31,.4);}
  #send:active{transform:scale(.97);}
  /* tasks */
  #view-tasks{padding:14px;}
  .trow{display:flex;align-items:center;gap:10px;background:rgba(12,3,6,.85);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;animation:pop .18s ease-out;}
  .trow.done .ttext{text-decoration:line-through;color:var(--muted);}
  .tcheck{width:20px;height:20px;flex:none;accent-color:var(--green);cursor:pointer;}
  .ttext{flex:1;font-size:14px;}
  .tby{font-size:10px;color:var(--muted);}
  .tdel{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;opacity:.6;}
  .tdel:hover{opacity:1;}
  /* notes */
  #view-notes{padding:14px;}
  #notes{flex:1;background:rgba(8,2,4,.9);border:1px solid var(--line);border-radius:12px;color:var(--txt);
    padding:14px;font-size:14px;outline:none;resize:none;font-family:inherit;line-height:1.6;min-height:200px;}
  #notes:focus{border-color:rgba(255,77,94,.5);}
  #notes-meta{font-size:11px;color:var(--muted);margin-top:8px;}
  /* activity */
  #view-activity{padding:14px;gap:8px;}
  .arow{background:rgba(12,3,6,.85);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;
    animation:pop .18s ease-out;}
  .arow b{color:var(--amber);}
  .arow time{display:block;font-size:10px;color:var(--muted);margin-top:2px;}
  /* name gate */
  #pwgate{position:fixed;inset:0;background:rgba(4,6,9,.82);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
  #pw{width:100%;background:rgba(8,2,4,.9);border:1px solid var(--line);border-radius:12px;color:var(--txt);
    padding:12px 14px;font-size:16px;outline:none;margin-bottom:12px;}
  #pw:focus{border-color:rgba(193,18,31,.55);box-shadow:0 0 0 3px rgba(193,18,31,.15);}
  #pwjoin{width:100%;background:linear-gradient(180deg,var(--blue),var(--blue-d));border:none;color:#fff;
    font-weight:800;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;}
  #pwerr{color:#f87171;font-size:12px;min-height:16px;margin-top:8px;}
  /* Moon circle: rotating ring of guardians */
  .moon-ring{
    position:absolute; top:50%; left:50%;
    width:300px; height:300px; margin:-150px 0 0 -150px;
    animation:moon-orbit 40s linear infinite;
    pointer-events:none; z-index:1;
  }
  .moon{
    position:absolute; width:64px; height:64px;
    border-radius:50%; object-fit:cover;
    background:radial-gradient(circle, rgba(193,18,31,.3), rgba(20,5,8,.9));
    border:2px solid rgba(255,130,140,.35);
    box-shadow:0 0 32px rgba(193,18,31,.55), inset 0 1px 0 rgba(255,160,170,.3);
    animation:moon-spin 40s linear infinite reverse;
  }
  .moon.m1{ top:-8px; left:50%; margin-left:-32px; }
  .moon.m2{ top:50%; right:-8px; margin-top:-32px; }
  .moon.m3{ bottom:-8px; left:50%; margin-left:-32px; }
  .moon.m4{ top:50%; left:-8px; margin-top:-32px; }
  @keyframes moon-orbit{ to{ transform:rotate(360deg); } }
  @keyframes moon-spin{ to{ transform:rotate(-360deg); } }
  #pwgate .card{ position:relative; z-index:2; }
  @media (prefers-reduced-motion:reduce){
    .moon-ring, .moon{ animation:none !important; }
  }
  #gate{position:fixed;inset:0;background:rgba(4,6,9,.82);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;}
  #gate .card{width:min(380px,100%);background:linear-gradient(180deg,rgba(20,5,8,.92),rgba(8,2,4,.95));
    border:1px solid var(--line);border-radius:18px;padding:26px 22px;text-align:center;
    box-shadow:0 24px 80px rgba(0,0,0,.6);}
  #gate h2{margin:0 0 6px;font-size:18px;}
  #gate p{color:var(--muted);font-size:13px;margin:0 0 16px;}
  #name{width:100%;background:#0a0e14;border:1px solid var(--line);border-radius:12px;color:var(--txt);
    padding:12px;font-size:15px;outline:none;text-align:center;}
  #join{width:100%;margin-top:12px;background:linear-gradient(180deg,#ff4d5e,#a30f1a);border:none;color:#2b060a;
    font-weight:800;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;}
  #err{color:#f87171;font-size:12px;min-height:16px;margin-top:8px;}
  @media (min-width:1024px){
    /* PC layout: room gets real width. Phones/tablets keep the layout above. */
    .shell{ width:min(1120px,94vw); height:min(920px,94vh); }
    #chat{ padding:20px 28px; gap:10px; }
    .bwrap{ max-width:62%; }
    .head h1{ font-size:17px; }
    .foot{ margin:12px 16px 16px; }
    #msg{ font-size:15px; }
  }
</style>
</head>

<div class="shell">
  <div class="head">
    <div class="head-top">
      <span class="dot off" id="livedot"></span>
      <h1>Highway Chat<small id="sub">connecting…</small></h1>
      <span class="me" id="mebadge">—</span>
    </div>
    <div id="presence"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-v="view-chat">💬 Chat</button>
    <button class="tab" data-v="view-tasks">✅ Tasks</button>
    <button class="tab" data-v="view-notes">📝 Notes</button>
    <button class="tab" data-v="view-activity">📡 Activity</button>
  </div>

  <div class="view active" id="view-chat">
    <div id="chat"></div>
    <div id="typing"></div>
    <div class="foot">
      <input id="msg" placeholder="Type a message…" autocomplete="off" maxlength="2000" />
      <button id="clear" title="Clear all chat messages" style="background:#1a1214;border:1px solid rgba(248,113,113,.4);color:var(--red);font-weight:700;border-radius:12px;padding:0 14px;font-size:14px;cursor:pointer;">🗑</button>
      <button id="send">Send</button>
    </div>
  </div>

  <div class="view" id="view-tasks">
    <div class="foot" style="border-top:none;border-bottom:1px solid var(--line);">
      <input id="taskin" placeholder="New team task…" autocomplete="off" maxlength="300" />
      <button id="taskadd" style="background:linear-gradient(180deg,#ff4d5e,#a30f1a);border:none;color:#2b060a;font-weight:700;border-radius:12px;padding:0 18px;font-size:14px;cursor:pointer;">Add</button>
    </div>
    <div id="tasklist" style="padding:14px;overflow-y:auto;flex:1;"></div>
  </div>

  <div class="view" id="view-notes">
    <textarea id="notes" placeholder="Shared team notes — everyone edits live…"></textarea>
    <div id="notes-meta">—</div>
  </div>

  <div class="view" id="view-activity">
    <div class="foot" style="border-top:none;border-bottom:1px solid var(--line);">
      <input id="actin" placeholder="Log what you're working on…" autocomplete="off" maxlength="300" />
      <button id="actadd" style="background:linear-gradient(180deg,var(--amber),#d97706);border:none;color:#1a1005;font-weight:700;border-radius:12px;padding:0 18px;font-size:14px;cursor:pointer;">Log</button>
    </div>
    <div id="actlist" style="padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  /* ============ FIREBASE PROJECT ============ */
  var FIREBASE_CONFIG = {
    apiKey:            "AIzaSyDmAMnxfBorxPkwt4Y2FjhkEB83914ut1U",
    authDomain:        "highway-chat.firebaseapp.com",
    projectId:         "highway-chat",
    storageBucket:     "highway-chat.firebasestorage.app",
    messagingSenderId: "1063748874829",
    appId:             "1:1063748874829:web:5565a2fa6012a0c3b76204"
  };

  /* ============ DEVICE ID (per-tab identity) ============ */
  var DEVICE_ID = sessionStorage.getItem("hw_device_id");
  if(!DEVICE_ID){
    DEVICE_ID = "d-" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    sessionStorage.setItem("hw_device_id", DEVICE_ID);
  }

  var $ = function(id){ return document.getElementById(id); };
  var chat=$("chat"), msg=$("msg"), sendBtn=$("send"),
      gate=$("gate"), nameIn=$("name"), joinBtn=$("join"),
      err=$("err"), sub=$("sub"), dot=$("livedot"), mebadge=$("mebadge"),
      presenceEl=$("presence"), typingEl=$("typing");
  var MY_NAME=null, db=null, seen={};
  var EMOJIS=["🔥","❤️","👍","😂","💯","👀"];
  var OWNERS=["sin","grim"]; // co-owners of the Highway — case-insensitive
  function isOwner(n){ return OWNERS.indexOf(String(n||"").toLowerCase())>=0; }
  function crownHtml(n){ return isOwner(n)?'<span class="crown" title="Owner">👑</span>':""; }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function scrollDown(el){ requestAnimationFrame(function(){ el.scrollTop = el.scrollHeight; }); }
  function sysLine(t){
    var d=document.createElement("div"); d.className="sys"; d.textContent=t;
    chat.appendChild(d); scrollDown(chat);
  }
  function fmtTs(ts){
    try{ var d=ts.toDate(); return d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }
    catch(e){ return ""; }
  }

  /* ================= CHAT ================= */
  function renderMsg(doc){
    var m=doc.data(); if(!m||seen[doc.id]) return; seen[doc.id]=1;
    var mine=(m.deviceId===DEVICE_ID);
    var row=document.createElement("div");
    row.className="row "+(mine?"me-row":"them-row");
    var rxHtml="";
    var rx=m.reactions||{};
    Object.keys(rx).forEach(function(e){
      var users=rx[e]||[];
      rxHtml+='<span class="rx'+(users.indexOf(MY_NAME)>=0?" mine":"")+'" data-id="'+doc.id+'" data-e="'+e+'">'+e+' '+(users.length||"")+'</span>';
    });
    rxHtml+='<span class="rx rx-add" data-id="'+doc.id+'" data-e="__pick__">＋</span>';
    row.innerHTML='<div class="bwrap"><div class="who">'+esc(m.name||"anon")+
      (mine?"":'<span class="ver">VERIFIED</span>')+crownHtml(m.name)+'</div>'+
      '<div class="bubble">'+esc(m.text||"")+'</div>'+
      '<div class="reacts">'+rxHtml+'</div></div>';
    chat.appendChild(row);
    row.querySelectorAll(".rx").forEach(function(el){
      el.addEventListener("click", function(){ toggleReaction(el.getAttribute("data-id"), el.getAttribute("data-e")); });
    });
    scrollDown(chat);
  }
  function toggleReaction(id, emoji){
    if(emoji==="__pick__"){
      var e=prompt("Pick an emoji reaction:\n"+EMOJIS.join(" "));
      if(!e) return; emoji=e.trim().slice(0,4);
    }
    var ref=db.collection("highway_messages").doc(id);
    ref.get().then(function(snap){
      var rx=(snap.data()&&snap.data().reactions)||{};
      var users=rx[emoji]||[];
      var i=users.indexOf(MY_NAME);
      if(i>=0) users.splice(i,1); else users.push(MY_NAME);
      if(users.length) rx[emoji]=users; else delete rx[emoji];
      ref.update({reactions:rx});
    });
  }
  function sendMsg(){
    var t=msg.value.trim(); if(!t||!MY_NAME||!db) return;
    msg.value=""; setTyping(false); msg.focus();
    db.collection("highway_messages").add({
      name:MY_NAME, text:t.slice(0,2000), deviceId:DEVICE_ID, reactions:{},
      ts:firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  /* ================= PRESENCE (who's online) =================
     Each device heartbeats its doc every 20s. Anyone whose ts is fresher
     than 60s counts as online. Best-effort delete on tab close. */
  var _yielded=false, _hbTimer=null;
  function stopHeartbeat(){ if(_hbTimer){ clearInterval(_hbTimer); _hbTimer=null; } }
  function startHeartbeat(){ stopHeartbeat(); _yielded=false; doBeat(); _hbTimer=setInterval(doBeat, 20000); }
  function kickDuplicates(){
    if(!db||!MY_NAME||_yielded) return;
    db.collection("highway_presence").where("name","==",MY_NAME).get().then(function(snap){
      snap.forEach(function(d){ if(d.id!==DEVICE_ID) d.ref.delete().catch(function(){}); });
    }).catch(function(){});
  }
  function doBeat(){
    if(!db||!MY_NAME||_yielded) return;
    var myRef=db.collection("highway_presence").doc(DEVICE_ID);
    myRef.get().then(function(doc){
      if(!doc.exists){
        return db.collection("highway_presence").where("name","==",MY_NAME).limit(1).get().then(function(snap){
          if(!snap.empty){
            _yielded=true; stopHeartbeat();
            myRef.delete().catch(function(){});
            if(presenceEl) presenceEl.innerHTML='<span style="font-size:11px;color:var(--amber)">signed in on another tab — this one is idle</span>';
            return "yielded";
          }
          return "recreate";
        });
      }
      return "beat";
    }).then(function(action){
      if(action==="yielded"||_yielded) return;
      myRef.set({name:MY_NAME, ts:firebase.firestore.FieldValue.serverTimestamp()}, {merge:true}).catch(function(){});
      kickDuplicates();
    }).catch(function(){
      myRef.set({name:MY_NAME, ts:firebase.firestore.FieldValue.serverTimestamp()}, {merge:true}).catch(function(){});
    });
  }
  function heartbeat(){ doBeat(); }
  window.addEventListener("beforeunload", function(){
    if(db) db.collection("highway_presence").doc(DEVICE_ID).delete().catch(function(){});
  });

  /* ================= TYPING INDICATORS ================= */
  var typingTimer=null;
  function setTyping(on){
    if(!db||!MY_NAME) return;
    db.collection("highway_typing").doc(DEVICE_ID).set({
      name:MY_NAME, typing:!!on, ts:firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  }

  /* ================= TASKS ================= */
  function renderTask(doc){
    var t=doc.data(); if(!t) return;
    var el=document.createElement("div");
    el.className="trow"+(t.done?" done":""); el.id="task-"+doc.id;
    el.innerHTML='<input type="checkbox" class="tcheck"'+(t.done?" checked":"")+'>'+
      '<span class="ttext">'+esc(t.text||"")+'</span>'+
      '<span class="tby">'+esc(t.createdBy||"")+'</span>'+
      '<button class="tdel">×</button>';
    el.querySelector(".tcheck").addEventListener("change", function(e){
      db.collection("highway_tasks").doc(doc.id).update({done:e.target.checked});
    });
    el.querySelector(".tdel").addEventListener("click", function(){
      if(confirm("Delete this task?")) db.collection("highway_tasks").doc(doc.id).delete();
    });
    return el;
  }

  /* ================= NOTES (shared live doc) ================= */
  var notesTimer=null, notesFocused=false, lastNotesTs=null;
  function saveNotes(){
    if(!db||!MY_NAME) return;
    db.collection("highway_notes").doc("shared").set({
      content:$("notes").value.slice(0,20000),
      updatedBy:MY_NAME, ts:firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  }

  /* ================= ACTIVITY FEED ================= */
  function logActivity(){
    var t=$("actin").value.trim(); if(!t||!db||!MY_NAME) return;
    $("actin").value="";
    db.collection("highway_activity").add({
      text:t.slice(0,300), by:MY_NAME,
      ts:firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  /* ================= GO LIVE ================= */
  function goLive(){
    try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); }
    catch(e){ sub.textContent="config error"; return; }

    dot.classList.remove("off"); sub.textContent="live · all systems synced";
    sysLine("Connected — chat, presence, tasks, notes & activity all sync live.");

    // chat listener
    db.collection("highway_messages").orderBy("ts","asc").limitToLast(100)
      .onSnapshot(function(s){ s.docChanges().forEach(function(c){
        if(c.type==="added") renderMsg(c.doc);
        if(c.type==="modified"){ // reactions changed -> re-render
          var old=document.querySelector('[data-id="'+c.doc.id+'"]');
          if(old){ delete seen[c.doc.id]; var rows=chat.querySelectorAll(".row");
            for(var i=0;i<rows.length;i++){ if(rows[i].innerHTML.indexOf('data-id="'+c.doc.id+'"')>=0){ rows[i].remove(); break; } }
            renderMsg(c.doc); }
        }
      }); });

    // presence listener
    db.collection("highway_presence").onSnapshot(function(s){
      var now=Date.now(), html="";
      s.forEach(function(d){
        var p=d.data(); if(!p||!p.ts) return;
        try{ if(now-p.ts.toDate().getTime()<60000) html+='<span class="p-chip">'+esc(p.name)+crownHtml(p.name)+'</span>'; }catch(e){}
      });
      presenceEl.innerHTML=html||'<span style="font-size:11px;color:var(--muted)">no one else here</span>';
    });

    // typing listener
    db.collection("highway_typing").onSnapshot(function(s){
      var names=[];
      s.forEach(function(d){
        var t=d.data();
        if(t&&t.typing&&d.id!==DEVICE_ID){
          try{ if(Date.now()-t.ts.toDate().getTime()<8000) names.push(t.name); }catch(e){}
        }
      });
      typingEl.textContent=names.length?names.join(", ")+(names.length>1?" are":" is")+" typing…":"";
    });

    // tasks listener
    db.collection("highway_tasks").orderBy("ts","asc")
      .onSnapshot(function(s){
        var list=$("tasklist"); list.innerHTML="";
        s.forEach(function(d){ var el=renderTask(d); if(el) list.appendChild(el); });
        if(!s.size) list.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">No tasks yet — add one above.</div>';
      });

    // notes listener
    db.collection("highway_notes").doc("shared")
      .onSnapshot(function(s){
        var d=s.data(); if(!d) return;
        if(!notesFocused && d.ts && (!lastNotesTs || d.ts.toMillis()>lastNotesTs)){
          lastNotesTs=d.ts.toMillis();
          $("notes").value=d.content||"";
        }
        $("notes-meta").textContent=d.updatedBy?("last edited by "+d.updatedBy):"";
      });

    // activity listener
    db.collection("highway_activity").orderBy("ts","desc").limit(30)
      .onSnapshot(function(s){
        var list=$("actlist"); list.innerHTML="";
        s.forEach(function(d){
          var a=d.data(); if(!a) return;
          var el=document.createElement("div"); el.className="arow";
          el.innerHTML="<b>"+esc(a.by||"")+"</b> "+esc(a.text||"")+"<time>"+fmtTs(a.ts)+"</time>";
          list.appendChild(el);
        });
        if(!s.size) list.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">Nothing logged yet.</div>';
      });

    startHeartbeat();
  }

  /* ================= PASSWORD GATE ================= */
  var _PW="TheEnd";
  try{ if(sessionStorage.getItem("hw_pw")==="1"){ $("pwgate").style.display="none"; $("gate").style.display="flex"; } }catch(e){}
  function tryPw(){
    if($("pw").value===_PW){
      try{ sessionStorage.setItem("hw_pw","1"); }catch(e){}
      $("pwgate").style.display="none";
      $("gate").style.display="flex";
      $("name").focus();
    } else {
      $("pwerr").textContent="Wrong password.";
      $("pw").value=""; $("pw").focus();
    }
  }
  $("pwjoin").addEventListener("click", tryPw);
  $("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") tryPw(); });

  /* ================= UI EVENTS ================= */
  function join(){
    var n=nameIn.value.trim().slice(0,24);
    if(!n){ err.textContent="Pick a name first."; return; }
    MY_NAME=n;
    mebadge.textContent=n+" · verified";
    gate.style.display="none";
    kickDuplicates();
    sysLine("You joined as "+n+" — verified on everything you do.");
    goLive(); msg.focus();
  }
  joinBtn.addEventListener("click", join);
  nameIn.addEventListener("keydown", function(e){ if(e.key==="Enter") join(); });

  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active");});
      document.querySelectorAll(".view").forEach(function(x){x.classList.remove("active");});
      t.classList.add("active"); $(t.getAttribute("data-v")).classList.add("active");
    });
  });

  sendBtn.addEventListener("click", sendMsg);
  $("clear").addEventListener("click", function(){
    if(!db||!confirm("Clear ALL chat messages for everyone? This cannot be undone.")) return;
    db.collection("highway_messages").get().then(function(s){
      var batch=db.batch();
      s.forEach(function(d){ batch.delete(d.ref); });
      return batch.commit();
    }).then(function(){ sysLine("Chat cleared — fresh highway."); })
    .catch(function(e){ sysLine("Clear failed: "+(e.message||e)); });
  });
  msg.addEventListener("keydown", function(e){
    if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMsg(); }
  });
  msg.addEventListener("input", function(){
    setTyping(true);
    clearTimeout(typingTimer);
    typingTimer=setTimeout(function(){ setTyping(false); }, 2000);
  });

  $("taskadd").addEventListener("click", function(){
    var t=$("taskin").value.trim(); if(!t||!db||!MY_NAME) return;
    $("taskin").value="";
    db.collection("highway_tasks").add({text:t.slice(0,300),done:false,createdBy:MY_NAME,
      ts:firebase.firestore.FieldValue.serverTimestamp()});
  });
  $("taskin").addEventListener("keydown", function(e){ if(e.key==="Enter") $("taskadd").click(); });

  $("notes").addEventListener("focus", function(){ notesFocused=true; });
  $("notes").addEventListener("blur", function(){ notesFocused=false; saveNotes(); });
  $("notes").addEventListener("input", function(){
    clearTimeout(notesTimer); notesTimer=setTimeout(saveNotes, 1000);
  });

  $("actadd").addEventListener("click", logActivity);
  $("actin").addEventListener("keydown", function(e){ if(e.key==="Enter") logActivity(); });

  nameIn.focus();
})();
</script>


<script>
/* Liquid Glass scroll morph: tab bar shrinks on scroll down, blooms on scroll up */
(function(){
  var tabs = document.querySelector('.tabs');
  if (!tabs) return;
  var lastY = 0, ticking = false;
  function onScroll(){
    var views = document.querySelectorAll('.view.active');
    var y = 0;
    views.forEach(function(v){ y = Math.max(y, v.scrollTop); });
    if (y > 60 && y > lastY + 4) tabs.classList.add('min');
    else if (y < lastY - 4 || y < 30) tabs.classList.remove('min');
    lastY = y;
    ticking = false;
  }
  document.querySelectorAll('.view').forEach(function(v){
    v.addEventListener('scroll', function(){
      if (!ticking){ requestAnimationFrame(onScroll); ticking = true; }
    }, { passive:true });
  });
  /* Ethereal embers: slow drifting particles */
  var reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (!reduced){
    for (var i = 0; i < 14; i++){
      var e = document.createElement('div');
      e.className = 'ember';
      var sz = 3 + Math.random() * 5;
      e.style.width = sz + 'px'; e.style.height = sz + 'px';
      e.style.left = (Math.random() * 100) + 'vw';
      e.style.top = (60 + Math.random() * 40) + 'vh';
      e.style.animationDuration = (9 + Math.random() * 8) + 's';
      e.style.animationDelay = (Math.random() * 10) + 's';
      document.body.appendChild(e);
    }
  }
  /* Luminescent trail follows touch */
  var glow = document.createElement('div');
  glow.className = 'touch-glow';
  document.body.appendChild(glow);
  var glowTimer = null;
  function showGlow(x, y){
    glow.style.left = x + 'px';
    glow.style.top = y + 'px';
    glow.style.opacity = '1';
    clearTimeout(glowTimer);
    glowTimer = setTimeout(function(){ glow.style.opacity = '0'; }, 800);
  }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length > 0) showGlow(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });
  document.addEventListener('mousemove', function(e){
    showGlow(e.clientX, e.clientY);
  }, { passive:true });
})();
</script>
<script>
/* Highway Chat push notifications */
(function(){
  var VAPID_PUBLIC = "BEm8B9zNCKOVR7_nvgrVOrBiVUJTnWTdLkn23Wk---Y03oqTXMDjXwvTliytNJBN412Z8gU7O29YGPpTke0Papk";
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

  function urlB64ToUint8(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    var raw = window.atob(base64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
    return out;
  }

  // Add a bell toggle button to the header
  function addBell(){
    var header = document.querySelector('header') || document.body;
    var btn = document.createElement('button');
    btn.id = 'pushbell';
    btn.title = 'Enable live notifications';
    btn.textContent = '\uD83D\uDD15';
    btn.style.cssText = 'background:none;border:1px solid #c1121f;color:#c1121f;border-radius:8px;padding:4px 10px;font-size:16px;cursor:pointer;margin-left:8px;';
    btn.onclick = enablePush;
    header.appendChild(btn);
    // Update bell state if already subscribed
    navigator.serviceWorker.ready.then(function(reg){
      reg.pushManager.getSubscription().then(function(sub){
        if (sub) { btn.textContent = '\uD83D\uDD14'; btn.title = 'Notifications on'; }
      });
    });
  }

  function enablePush(){
    if (Notification.permission === 'denied') { alert('Notifications blocked. Enable them in Settings > Highway Chat.'); return; }
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC) });
    }).then(function(sub){
      var btn = document.getElementById('pushbell');
      if (btn) { btn.textContent = '\uD83D\uDD14'; btn.title = 'Notifications on'; }
      // Save subscription to Firestore
      var subJson = sub.toJSON();
      if (typeof db !== 'undefined' && db) {
        var myName = 'anon';
        try { myName = sessionStorage.getItem('hw_name') || localStorage.getItem('hw_name') || 'anon'; } catch(e){}
        db.collection('highway_push_subs').doc(btoa(sub.endpoint).replace(/[^a-zA-Z0-9]/g,'').substring(0,60)).set({
          endpoint: sub.endpoint,
          keys: subJson.keys,
          name: myName,
          platform: navigator.platform || 'unknown',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      }
    }).catch(function(err){ console.warn('push subscribe failed', err); });
  }

  // Register service worker
  navigator.serviceWorker.register('sw.js').then(function(){ addBell(); }).catch(function(e){ console.warn('sw failed', e); });
})();
</script>
