  <div class="card">
    <h2>🔒 Highway Chat</h2>
    <p>This room is locked.<br/>Enter the password to continue.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="off" />
    <button id="pwjoin">Unlock</button>
    <div id="pwerr"></div>
  </div>
</div>
<div id="gate" style="display:none">
  <div class="card">
    <h2>🛣️ Highway Chat</h2>
    <p>Choose your verified display name.<br/>It will be badged on everything you do.</p>
    <input id="name" maxlength="24" placeholder="e.g. whisper" autocomplete="off" />
    <div id="authfields" style="display:none">
      <input id="email" type="email" placeholder="Highway account email" autocomplete="email" style="margin-top:8px" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px" />
    </div>
    <button id="join">Enter the highway</button>
    <div id="err"></div>
  </div>
</div>

<div class="shell">
  <div class="head">
    <div class="head-top">
      <span class="dot off" id="livedot"></span>
      <h1>Highway Chat<small id="sub">connecting…</small></h1>
      <span class="me" id="mebadge">—</span>
      <span id="devbadge" style="font-size:9px;opacity:.5;margin-left:6px"></span>
    </div>
    <div id="presence"></div>
  </div>

  <div class="tabs"><span class="tab-glider"></span><button class="tab active" data-v="view-chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 5z"/></svg> Chat</button><button class="tab" data-v="view-tasks"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M9 12l2 2 4-4"/></svg> Tasks</button><button class="tab" data-v="view-notes"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Notes</button><button class="tab" data-v="view-activity"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Activity</button><button class="tab" data-v="view-news"><svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0V9"/></svg> News</button><button class="tab" data-v="view-quests"><svg viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg> Quests</button><button class="tab" data-v="view-wins"><svg viewBox="0 0 24 24"><path d="M6 2h12v4h4v2c0 2-1.5 3.5-3.5 3.9A6 6 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1a6 6 0 0 1-5.5-4C3.5 11.5 2 10 2 8V6h4V2z"/></svg> Wins</button></div>

  <div class="view active" id="view-chat">
    <div id="chat"></div>
    <div id="typing"></div>
    <div class="foot">
      <input id="msg" placeholder="Type a message…" autocomplete="off" maxlength="2000" />
      <button id="clear" title="Clear all chat messages" style="background:#1a1214;border:1px solid rgba(248,113,113,.4);color:var(--red);font-weight:700;border-radius:12px;padding:0 14px;font-size:14px;cursor:pointer;">🗑</button>
      <button id="voiceBtn" title="Voice message" style="background:#1a1214;border:1px solid rgba(248,113,113,.4);color:var(--red);font-weight:700;border-radius:12px;padding:0 14px;font-size:18px;cursor:pointer;">🎤</button>
      <button id="send">Send</button>
    </div>
  </div>

  <div class="view" id="view-tasks">
    <div class="foot" style="border-top:none;border-bottom:1px solid var(--line);">
      <input id="taskin" placeholder="New team task…" autocomplete="off" maxlength="300" />
      <button id="taskadd" style="background:linear-gradient(180deg,#ff4d5e,#a30f1a);border:none;color:#2b060a;font-weight:700;border-radius:12px;padding:0 18px;font-size:14px;cursor:pointer;">Add</button>
    </div>
    <div id="tasklist" style="padding:14px;overflow-y:auto;flex:1;"></div>
  </div>

  <div class="view" id="view-notes">
    <textarea id="notes" placeholder="The page is blank. Write something worth remembering…"></textarea>
    <div id="notes-meta">—</div>
  </div>

  <div class="view" id="view-activity">
    <div class="foot" style="border-top:none;border-bottom:1px solid var(--line);">
      <input id="actin" placeholder="Log what you're working on…" autocomplete="off" maxlength="300" />
      <button id="actadd" style="background:linear-gradient(180deg,var(--amber),#d97706);border:none;color:#1a1005;font-weight:700;border-radius:12px;padding:0 18px;font-size:14px;cursor:pointer;">Log</button>
    </div>
    <div id="actlist" style="padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;"></div>
  </div>

  <div class="view" id="view-news">
    <div id="newslist" style="padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px;"></div>
  </div>
</div>

<div class="view" id="view-quests"><div id="questlist"></div></div><div class="view" id="view-wins"><div id="winlist"></div></div>
<div id="huddlebanner" class="huddle-banner" style="display:none;">🔥 HUDDLE MODE — focus up</div>
<div id="cityteaser" class="city-teaser" style="display:none;">
  <h4>🌃 MONEY CITY</h4>
  <p style="font-size:13px;color:var(--muted);">The Highway leads somewhere. Stay tuned.</p>
</div>
<div id="ambient" style="padding:6px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;"></div>
<script src="highway.js"></script>
<div id="emoji-picker"></div>
</body>
</html></div>
